name: GitHub hook IPs
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: curl -fsS https://api.github.com/meta | jq -r '.hooks[]' > subnets/github-hooks
      - run: |
          git diff --quiet && exit 0
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git commit -am "Update GitHub hook IPs" && git push
